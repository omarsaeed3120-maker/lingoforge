/* ══════════ DATA VALIDATION (the fix) ══════════ */
const AR_RE=/[\u0600-\u06FF]/;
const hasArabic=s=>AR_RE.test(String(s||""));
const hasLatin=s=>/[a-zA-Z]/.test(String(s||""));
const cleanStr=s=>String(s||"").replace(/\.{2,}\s*$/,"").replace(/\s+/g," ").trim();

/* A valid pair MUST have: English side with real latin letters (2+ chars, not just a number),
   Arabic side with real arabic script. This is what kills the "6 / 8 / 9" bug. */
const validPair=(en,ar)=>{
  en=cleanStr(en); ar=cleanStr(ar);
  if(!en||!ar) return null;
  if(!hasLatin(en)) return null;              // rejects "6", "", "—"
  if(en.replace(/[^a-zA-Z]/g,"").length<2) return null; // rejects "a1", "x"
  if(!hasArabic(ar)) return null;             // rejects numbers/latin in arabic slot
  if(hasArabic(en)) return null;              // english slot must not be arabic
  if(/^(english phrase|phrase|sentence|#|no|num)$/i.test(en)) return null; // headers
  return {en,ar};
};

/* Smart row parser: tries every column combination, picks the first valid one */
const parseRow=(r)=>{
  const cells=(r||[]).map(c=>cleanStr(c)).filter(c=>c!=="");
  if(cells.length<2) return null;
  // Find the first latin cell and the first arabic cell
  const enCell=cells.find(c=>hasLatin(c)&&!hasArabic(c)&&c.replace(/[^a-zA-Z]/g,"").length>=2);
  const arCell=cells.find(c=>hasArabic(c));
  if(enCell&&arCell){
    const v=validPair(enCell,arCell);
    if(v){
      // pronunciation = another arabic cell that isn't the translation
      const pron=cells.find(c=>c!==arCell&&c!==enCell&&hasArabic(c)&&c.length<25)||"";
      return {...v,pron};
    }
  }
  return null;
};

/* ══════════ UTILS ══════════ */
const sh=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=~~(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b};
const nm=s=>String(s||"").trim().toLowerCase().replace(/[?.!,;:'"`’]/g,"").replace(/\s+/g," ");
const pick=(ps,n)=>{
  if(!ps.length)return[];
  const w=ps.map(p=>({p,w:Math.max(7-(p.st||0)*1.1,1.8)}));
  const tot=w.reduce((s,x)=>s+x.w,0);const out=[];const seen=new Set();
  const max=Math.min(n,ps.length);let guard=0;
  while(out.length<max&&guard++<max*20){
    let r=Math.random()*tot;
    for(let i=0;i<w.length;i++){if(seen.has(i))continue;r-=w[i].w;if(r<=0){out.push(w[i].p);seen.add(i);break}}
  }
  return sh(out);
};
const say=(t,rate=.85)=>{if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=rate;speechSynthesis.speak(u)};

/* ══════════ SIGN IN SCREEN ══════════ */
function Auth({onDone,onSkip}){
  const[mode,setMode]=useState("in");
  const[em,setEm]=useState(""),[pw,setPw]=useState("");
  const[busy,setBusy]=useState(false),[err,setErr]=useState("");
  const go=async()=>{
    setErr("");
    if(!em.trim()||pw.length<6){setErr("Enter your email and a password of 6+ characters.");return}
    if(!sb){setErr("Cannot reach the server. Check your internet.");return}
    setBusy(true);
    try{
      const fn=mode==="in"?sb.auth.signInWithPassword({email:em.trim(),password:pw})
                          :sb.auth.signUp({email:em.trim(),password:pw});
      const{data,error}=await fn;
      if(error){setErr(error.message);setBusy(false);return}
      if(!data.session&&!data.user){setErr("Something went wrong. Try again.");setBusy(false);return}
      onDone();
    }catch(e){setErr("Connection failed.")}
    setBusy(false);
  };
  return(<div style={{minHeight:"100vh",display:"flex",flexDirection:"column",justifyContent:"center",padding:"32px 24px"}}>
    <div style={{textAlign:"center",marginBottom:28}}>
      <div style={{fontSize:9.5,color:"var(--acc)",textTransform:"uppercase",letterSpacing:".18em",fontWeight:600,marginBottom:8}}>LingoForge</div>
      <div style={{fontSize:24,fontWeight:700,letterSpacing:"-.03em",marginBottom:7}}>{mode==="in"?"Welcome back":"Create your account"}</div>
      <div style={{fontSize:13,color:"var(--txt3)",lineHeight:1.65}}>Sign in on every device and your progress follows you automatically.</div>
    </div>
    <input value={em} onChange={e=>setEm(e.target.value)} placeholder="Email" type="email" dir="ltr" autoComplete="email"
      style={{width:"100%",padding:"15px 17px",fontSize:15,background:"var(--surface)",border:"1px solid var(--line)",borderRadius:14,color:"var(--txt)",marginBottom:10}}/>
    <input value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="Password" type="password" dir="ltr"
      autoComplete={mode==="in"?"current-password":"new-password"}
      style={{width:"100%",padding:"15px 17px",fontSize:15,background:"var(--surface)",border:"1px solid var(--line)",borderRadius:14,color:"var(--txt)",marginBottom:14}}/>
    {err&&<div style={{padding:"11px 14px",background:"rgba(255,92,92,.1)",border:"1px solid rgba(255,92,92,.3)",borderRadius:12,fontSize:12.5,color:"var(--err)",marginBottom:12,lineHeight:1.55}}>{err}</div>}
    <button onClick={go} disabled={busy} style={{width:"100%",padding:16,borderRadius:14,background:busy?"var(--surface2)":"var(--acc)",color:busy?"var(--txt3)":"#00150E",fontSize:15.5,fontWeight:700,marginBottom:12}}>
      {busy?"Working…":mode==="in"?"Sign in":"Create account"}</button>
    <button onClick={()=>{setMode(mode==="in"?"up":"in");setErr("")}} style={{width:"100%",padding:12,fontSize:13,color:"var(--txt2)",marginBottom:18}}>
      {mode==="in"?"No account yet? Create one":"Already have an account? Sign in"}</button>
    <button onClick={onSkip} style={{width:"100%",padding:13,borderRadius:13,background:"transparent",border:"1px solid var(--line)",fontSize:12.5,color:"var(--txt3)"}}>
      Continue without syncing</button>
  </div>);
}

/* Sanitize anything already in storage — removes the corrupted "6/8/9" rows */
const sanitize=arr=>(arr||[]).map(p=>{
  const v=validPair(p.en,p.ar);
  return v?{...p,en:v.en,ar:v.ar}:null;
}).filter(Boolean);

      <button onClick={onExit} style={{width:"100%",padding:14,borderRadius:13,background:"var(--surface2)",fontSize:15,fontWeight:500}}>Back to hub</button>
    </div>
  );
};

const Prompt=({label,text,ar,onSpeak})=>(

/* ══════════ 1. FLIP CARDS ══════════ */
function Flash({ph,up,onExit}){
  const[k,setK]=useState(0);
  const[cards,setCards]=useState(()=>pick(ph,Math.min(12,ph.length)));
  const[i,setI]=useState(0),[f,setF]=useState(false),[sc,setSc]=useState({c:0,t:0}),[end,setEnd]=useState(null);
  const c=cards[i];
  const go=knew=>{up(c.en,knew);const n={c:sc.c+(knew?1:0),t:sc.t+1};setSc(n);
    if(i+1>=cards.length)setEnd(n);else{setI(i+1);setF(false)}};
  const again=()=>{setCards(pick(ph,Math.min(12,ph.length)));setI(0);setF(false);setSc({c:0,t:0});setEnd(null);setK(k+1)};
  if(end)return<><Top t="Flip Cards" onBack={onExit}/><Recap c={end.c} t={end.t} onExit={onExit} onAgain={again}/></>;
  return(<div key={k}>
    <Top t="Flip Cards" sub={`${i+1} / ${cards.length}`} onBack={onExit}/>
    <div style={{padding:"0 20px 20px"}}><Bar v={(i+1)/cards.length*100} c="var(--p1)"/></div>
    <div style={{padding:"0 20px"}}>
      <div onClick={()=>setF(!f)} className="fu" style={{minHeight:230,background:f?"linear-gradient(150deg,#2A1F5C,#1A1440)":"var(--surface)",border:`1px solid ${f?"var(--p1)":"var(--line)"}`,borderRadius:22,padding:"30px 24px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",transition:"all .35s cubic-bezier(.4,0,.2,1)"}}>
        <div style={{fontSize:10,color:"var(--txt3)",textTransform:"uppercase",letterSpacing:".12em",marginBottom:14}}>{f?"Arabic":"English"} · tap to flip</div>
        <div className={f?"ar":""} dir={f?"rtl":"ltr"} style={{fontSize:f?21:23,fontWeight:600,textAlign:"center",lineHeight:1.55}}>{f?c.ar:c.en}</div>
        {f&&c.pron&&<div className="ar" style={{marginTop:11,fontSize:13,color:"var(--p1)",opacity:.85}}>◉ {c.pron}</div>}
        {!f&&<button onClick={e=>{e.stopPropagation();say(c.en)}} style={{marginTop:18,padding:"8px 17px",borderRadius:11,background:"var(--surface2)",fontSize:12.5,color:"var(--txt2)"}}>◉ Play</button>}
      </div>
      {f&&<div className="fu" style={{display:"flex",gap:10,marginTop:16}}>
        <button onClick={()=>go(false)} style={{flex:1,padding:15,borderRadius:14,background:"rgba(255,92,92,.12)",border:"1px solid rgba(255,92,92,.3)",color:"var(--err)",fontSize:14.5,fontWeight:600}}>Missed it</button>
        <button onClick={()=>go(true)} style={{flex:1,padding:15,borderRadius:14,background:"rgba(0,229,160,.12)",border:"1px solid rgba(0,229,160,.3)",color:"var(--acc)",fontSize:14.5,fontWeight:600}}>Knew it</button>
      </div>}
    </div>
  </div>);
}

/* ══════════ 2. MULTIPLE CHOICE ══════════ */
function MCQ({ph,all,up,onExit}){
  const pool=all.length>=4?all:ph;
  const mk=()=>pick(ph,Math.min(12,ph.length)).map(q=>({q,dir:Math.random()>.5?"e":"a",o:sh([q,...sh(pool.filter(p=>p.en!==q.en)).slice(0,3)])}));
  const[k,setK]=useState(0),[qs,setQs]=useState(mk);
  const[i,setI]=useState(0),[s,setS]=useState(null),[sc,setSc]=useState({c:0,t:0}),[end,setEnd]=useState(null);
  const q=qs[i];const ok=s!==null&&q.o[s].en===q.q.en;
  const tap=x=>{if(s!==null)return;setS(x);up(q.q.en,q.o[x].en===q.q.en)};
  const nx=()=>{const n={c:sc.c+(ok?1:0),t:sc.t+1};setSc(n);if(i+1>=qs.length)setEnd(n);else{setI(i+1);setS(null)}};
  const again=()=>{setQs(mk());setI(0);setS(null);setSc({c:0,t:0});setEnd(null);setK(k+1)};
  if(end)return<><Top t="Choose" onBack={onExit}/><Recap c={end.c} t={end.t} onExit={onExit} onAgain={again}/></>;
  return(<div key={k} style={{paddingBottom:s!==null?170:20}}>
    <Top t="Choose" sub={`${i+1} / ${qs.length}`} onBack={onExit}/>
    <div style={{padding:"0 20px 18px"}}><Bar v={(i+1)/qs.length*100} c="var(--p2)"/></div>
    <div style={{padding:"0 20px"}}>
      <Prompt label={q.dir==="e"?"Translate to Arabic":"Translate to English"} text={q.dir==="e"?q.q.en:q.q.ar} ar={q.dir==="a"} onSpeak={q.dir==="e"?()=>say(q.q.en):null}/>
      <div style={{display:"flex",flexDirection:"column",gap:9}}>
        {q.o.map((o,x)=>{
          const right=o.en===q.q.en,mine=s===x;
          let bg="var(--surface)",bd="var(--line)",col="var(--txt)";
          if(s!==null){if(right){bg="rgba(0,229,160,.13)";bd="var(--acc)";col="var(--acc)"}
            else if(mine){bg="rgba(255,92,92,.13)";bd="var(--err)";col="var(--err)"}
            else{col="var(--txt3)"}}

/* ══════════ 3. TYPE ══════════ */

/* ══════════ 4. MATCH ══════════ */
function Match({ph,up,onExit}){

  const[k,setK]=useState(0),[it,setIt]=useState(mk);

    else{setBad(p.en);up(sel,false);setSc(x=>({...x,w:x.w+1}));setTimeout(()=>setBad(null),600)}};
  const again=()=>{setIt(mk());setSel(null);setHit(new Set());setBad(null);setSc({c:0,w:0});setDone(false);setK(k+1)};

  };

        {it.r.map(p=><button key={p.en+"_a"} onClick={()=>R(p)} className="ar" style={cell(p.ar,hit.has(p.en)?"hit":bad===p.en?"bad":"")}>{p.ar}</button>)}
      </div>
    </div>
  </div>);
}

/* ══════════ 5. BUILD ══════════ */

/* ══════════ UNLOCK GATE ══════════ */
function Gate({ph,onPass,onExit}){
  const[t,setT]=useState(""),[res,setRes]=useState(null),[peek,setPeek]=useState(false);
  const words=t.trim().split(/\s+/).filter(Boolean).length;
  const check=()=>{
    const low=" "+t.toLowerCase().replace(/[^\w\s]/g," ").replace(/\s+/g," ")+" ";
    const rows=ph.map(p=>{
      const clean=p.en.toLowerCase().replace(/[^\w\s]/g," ").replace(/\s+/g," ").trim();
      const w=clean.split(" ").filter(x=>x.length>1);
      const exact=low.includes(" "+clean+" ");
      const partial=w.length>=2&&w.filter(x=>low.includes(" "+x+" ")).length>=Math.ceil(w.length*.75);
      return{...p,found:exact||partial};
    });
    const f=rows.filter(r=>r.found).length;
    const pct=Math.round(f/ph.length*100);

  };
  return(<div style={{paddingBottom:30}}>
    <Top t="Unlock Gate" sub={`Use your ${ph.length} phrases`} onBack={onExit}/>
    <div style={{padding:"0 20px"}}>

      </div>

      <button onClick={()=>setPeek(!peek)} style={{width:"100%",padding:"11px",background:"var(--surface)",border:"1px solid var(--line)",borderRadius:12,fontSize:12,color:"var(--txt3)",marginBottom:12}}>
        {peek?"◇ Hide":"◈ Peek at"} the {ph.length} phrases {peek?"":"(try without it first)"}
      </button>
      {peek&&<div style={{maxHeight:170,overflowY:"auto",background:"var(--surface)",border:"1px solid var(--line)",borderRadius:13,padding:12,marginBottom:12}}>
        {ph.map((p,x)=><div key={x} style={{display:"flex",justifyContent:"space-between",gap:10,padding:"5px 0",borderBottom:x<ph.length-1?"1px solid var(--line)":"none",fontSize:11.5}}>
          <span dir="ltr" style={{color:"var(--txt2)"}}>{p.en}</span><span className="ar" style={{color:"var(--txt3)",flexShrink:0}}>{p.ar}</span></div>)}
      </div>}

      <textarea value={t} onChange={e=>{setT(e.target.value);setRes(null)}} placeholder="Start writing your paragraph in English…" dir="ltr"
        style={{width:"100%",minHeight:170,padding:16,fontSize:15,background:"var(--surface)",border:"1px solid var(--line)",borderRadius:15,color:"var(--txt)",resize:"vertical",lineHeight:1.75}}/>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:11.5,color:words>=20?"var(--acc)":"var(--txt3)",marginTop:7,marginBottom:14}}>
        <span>{words} words</span><span>{words>=20?"✓ length ok":`${20-words} more needed`}</span>

          </div>
        </div>
        <div style={{maxHeight:210,overflowY:"auto",background:"var(--surface)",border:"1px solid var(--line)",borderRadius:14,padding:12,marginBottom:14}}>
          {res.rows.map((p,x)=><div key={x} style={{display:"flex",alignItems:"center",gap:9,padding:"6px 0",borderBottom:x<res.rows.length-1?"1px solid var(--line)":"none",fontSize:12}}>
            <span style={{width:16,height:16,borderRadius:5,background:p.found?"var(--acc)":"var(--surface2)",color:p.found?"#00150E":"var(--txt3)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,flexShrink:0}}>{p.found?"✓":"·"}</span>

    const have=new Set(ph.map(p=>nm(p.en)));
    const good=[],bad=[];
    for(const r of rows){const v=parseRow(r);if(v)good.push(v);else if((r||[]).some(c=>cleanStr(c)))bad.push(r)}
    const seen=new Set(),uniq=[];
    for(const g of good){const key=nm(g.en);if(seen.has(key))continue;seen.add(key);uniq.push(g)}
    const fresh=uniq.filter(p=>!have.has(nm(p.en)));
    setPv({parsed:uniq.length,skipped:bad.length,fresh:fresh.length,items:fresh});
    setMsg("");
  };
  const file=f=>{if(!f)return;setMsg("Reading file…");const rd=new FileReader();
    rd.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];run(XLSX.utils.sheet_to_json(ws,{header:1,defval:""}))}
      catch(err){setMsg("Could not read: "+err.message)}};
    rd.readAsArrayBuffer(f)};
  return(<div style={{paddingBottom:30}}>
    <Top t="Import Phrases" sub={`${ph.length} in library`} onBack={onExit}/>
    <div style={{padding:"0 20px"}}>
      <div style={{display:"flex",gap:7,marginBottom:16,background:"var(--surface)",padding:4,borderRadius:13,border:"1px solid var(--line)"}}>
        {[["file","Excel file"],["paste","Paste rows"]].map(([id,l])=>
          <button key={id} onClick={()=>{setTab(id);setPv(null);setMsg("")}} style={{flex:1,padding:"9px",borderRadius:10,fontSize:13,fontWeight:600,background:tab===id?"var(--surface2)":"transparent",color:tab===id?"var(--txt)":"var(--txt3)",transition:"all .2s"}}>{l}</button>)}
      </div>

      {tab==="file"&&<div onDrop={e=>{e.preventDefault();setDrag(false);file(e.dataTransfer.files[0])}}
        onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)}
        onClick={()=>fr.current?.click()}
        style={{border:`2px dashed ${drag?"var(--acc)":"var(--line)"}`,background:drag?"rgba(0,229,160,.05)":"var(--surface)",borderRadius:17,padding:"38px 20px",textAlign:"center",transition:"all .2s"}}>
        <div style={{fontSize:38,color:"var(--txt3)",marginBottom:9}}>⬒</div>
        <div style={{fontSize:14.5,fontWeight:600,marginBottom:4}}>Drop your .xlsx here</div>
        <div style={{fontSize:12,color:"var(--txt3)",lineHeight:1.6}}>or tap to browse<br/>Columns are detected automatically</div>
        <input ref={fr} type="file" accept=".xlsx,.xls,.csv" onChange={e=>file(e.target.files[0])} style={{display:"none"}}/>
      </div>}

      {tab==="paste"&&<>
        <textarea value={txt} onChange={e=>{setTxt(e.target.value);setPv(null)}} placeholder={"Paste rows from Excel (Ctrl+A → Ctrl+C → paste here)"} dir="ltr"
          style={{width:"100%",minHeight:140,padding:14,fontSize:12.5,background:"var(--surface)",border:"1px solid var(--line)",borderRadius:14,color:"var(--txt)",resize:"vertical",fontFamily:"ui-monospace,monospace"}}/>
        {txt.trim()&&!pv&&<button onClick={()=>run(txt.split("\n").filter(l=>l.trim()).map(l=>l.split("\t")))}
          style={{width:"100%",marginTop:12,padding:15,borderRadius:14,background:"var(--acc)",color:"#00150E",fontSize:15,fontWeight:600}}>Parse rows</button>}
      </>}

      {msg&&<div style={{marginTop:12,padding:12,background:"var(--surface)",border:"1px solid var(--line)",borderRadius:12,fontSize:12.5,color:"var(--txt2)",textAlign:"center"}}>{msg}</div>}

      {pv&&<div className="fu" style={{marginTop:16}}>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {[["Valid",pv.parsed,"var(--acc)"],["New",pv.fresh,"var(--p2)"],["Skipped",pv.skipped,"var(--txt3)"]].map(([l,v,c])=>
            <div key={l} style={{flex:1,background:"var(--surface)",border:"1px solid var(--line)",borderRadius:13,padding:"12px 6px",textAlign:"center"}}>
              <div style={{fontSize:20,fontWeight:700,color:c}}>{v}</div>
              <div style={{fontSize:9.5,color:"var(--txt3)",textTransform:"uppercase",letterSpacing:".08em"}}>{l}</div>
            </div>)}
        </div>
        {pv.skipped>0&&<div style={{fontSize:11.5,color:"var(--txt3)",marginBottom:12,padding:"9px 12px",background:"var(--surface)",borderRadius:11,lineHeight:1.6}}>
          {pv.skipped} row{pv.skipped>1?"s":""} skipped — headers, numbers, or rows missing an English or Arabic side.
        </div>}
        {pv.items.length>0?<>
          <div style={{maxHeight:190,overflowY:"auto",background:"var(--surface)",border:"1px solid var(--line)",borderRadius:14,padding:12,marginBottom:14}}>
            {pv.items.slice(0,25).map((p,x)=><div key={x} style={{display:"flex",justifyContent:"space-between",gap:10,padding:"6px 0",borderBottom:"1px solid var(--line)",fontSize:12}}>
              <span dir="ltr" style={{color:"var(--txt)"}}>{p.en}</span><span className="ar" style={{color:"var(--txt3)",flexShrink:0}}>{p.ar}</span></div>)}
            {pv.items.length>25&&<div style={{fontSize:11.5,color:"var(--txt3)",textAlign:"center",paddingTop:9}}>+{pv.items.length-25} more</div>}
          </div>
          <button onClick={()=>{onAdd(pv.items);setPv(null);setTxt("")}} style={{width:"100%",padding:16,borderRadius:14,background:"var(--acc)",color:"#00150E",fontSize:15.5,fontWeight:700}}>Add {pv.fresh} phrases to library</button>
        </>:<div style={{textAlign:"center",padding:"16px",color:"var(--txt3)",fontSize:13.5}}>Nothing new — all already in your library</div>}
      </div>}
    </div>
  </div>);
}

/* ══════════ LIBRARY ══════════ */
function Library({ph,unlocked,onExit,onWipe,onExport,onImportBackup,user,onSignIn,onSignOut}){
  const[q,setQ]=useState("");
  const list=useMemo(()=>{
    const f=q.trim().toLowerCase();
    return ph.map((p,i)=>({...p,i})).filter(p=>!f||p.en.toLowerCase().includes(f)||p.ar.includes(f));
  },[ph,q]);
  return(<div style={{paddingBottom:30}}>
    <Top t="Library" sub={`${ph.length} phrases · ${unlocked} unlocked`} onBack={onExit}/>
    <div style={{padding:"0 20px"}}>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search English or Arabic…" dir="auto"
        style={{width:"100%",padding:"13px 16px",fontSize:14,background:"var(--surface)",border:"1px solid var(--line)",borderRadius:13,color:"var(--txt)",marginBottom:14}}/>
      <div style={{background:"var(--surface)",border:"1px solid var(--line)",borderRadius:15,overflow:"hidden"}}>
        {list.slice(0,300).map((p,x)=>{
          const locked=p.i>=unlocked;const st=p.st||0;
          return<div key={x} style={{padding:"11px 14px",borderBottom:x<Math.min(list.length,300)-1?"1px solid var(--line)":"none",opacity:locked?.4:1}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"center",marginBottom:3}}>
              <span dir="ltr" style={{fontSize:13.5,fontWeight:500,flex:1}}>{p.en}</span>
              <span style={{fontSize:10,color:"var(--txt3)",flexShrink:0,letterSpacing:"-.5px"}}>{locked?"🔒":"●".repeat(st)+"○".repeat(5-st)}</span>
            </div>
            <div className="ar" style={{fontSize:12.5,color:"var(--txt3)"}}>{p.ar}</div>
          </div>})}
        {list.length>300&&<div style={{padding:12,textAlign:"center",fontSize:11.5,color:"var(--txt3)"}}>Showing first 300 of {list.length}</div>}
        {!list.length&&<div style={{padding:24,textAlign:"center",fontSize:13,color:"var(--txt3)"}}>No matches</div>}
      </div>
      {/* ACCOUNT */}
      <div style={{marginTop:18,background:"var(--surface)",border:"1px solid var(--line)",borderRadius:15,padding:16}}>
        <div style={{fontSize:12.5,fontWeight:600,marginBottom:4}}>Account</div>
        {user
          ?<>
            <div style={{fontSize:11.5,color:"var(--txt3)",lineHeight:1.65,marginBottom:12}}>
              Signed in as <span style={{color:"var(--acc)"}}>{user.email}</span>. Your progress saves to the cloud automatically and loads on any device you sign in on.
            </div>
            <button onClick={onSignOut} style={{width:"100%",padding:12,borderRadius:12,background:"var(--surface2)",border:"1px solid var(--line)",fontSize:13,fontWeight:600}}>Sign out</button>
          </>
          :<>
            <div style={{fontSize:11.5,color:"var(--txt3)",lineHeight:1.65,marginBottom:12}}>
              Not signed in — progress stays on this device only. Sign in to sync it across your phone and computer.
            </div>
            <button onClick={onSignIn} style={{width:"100%",padding:12,borderRadius:12,background:"var(--acc)",color:"#00150E",fontSize:13,fontWeight:600}}>Sign in to sync</button>
          </>}
      </div>

      {/* BACKUP / SYNC */}
      <div style={{marginTop:18,background:"var(--surface)",border:"1px solid var(--line)",borderRadius:15,padding:16}}>
        <div style={{fontSize:12.5,fontWeight:600,marginBottom:4}}>Backup & move to another device</div>
        <div style={{fontSize:11.5,color:"var(--txt3)",lineHeight:1.65,marginBottom:12}}>
          Save a file here, send it to your other device (WhatsApp / OneDrive), then load it there. Your phrases, strength and batch all come with it.
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={onExport} style={{flex:1,padding:12,borderRadius:12,background:"var(--acc)",color:"#00150E",fontSize:13,fontWeight:600}}>↓ Save backup</button>
          <button onClick={onImportBackup} style={{flex:1,padding:12,borderRadius:12,background:"var(--surface2)",border:"1px solid var(--line)",fontSize:13,fontWeight:600}}>↑ Load backup</button>
        </div>
      </div>

      <button onClick={onWipe} style={{width:"100%",marginTop:14,padding:13,borderRadius:13,background:"transparent",border:"1px solid rgba(255,92,92,.3)",color:"var(--err)",fontSize:13,fontWeight:500}}>Reset all progress</button>
    </div>
  </div>);
}

/* ══════════ APP ══════════ */
function App(){
  const[lib,setLib]=useState([]),[batch,setBatch]=useState(1),[streak,setStreak]=useState(0);
  const[best,setBest]=useState(0),[scr,setScr]=useState("hub"),[boot,setBoot]=useState(true);
  const[user,setUser]=useState(null),[needAuth,setNeedAuth]=useState(false),[syncing,setSyncing]=useState(false);
  const pushTimer=useRef(null);

  /* debounced upload — never blocks the UI */
  const cloudPush=useCallback((payload)=>{
    if(!user)return;
    clearTimeout(pushTimer.current);
    pushTimer.current=setTimeout(async()=>{
      setSyncing(true);
      await cloudPut(user.id,payload);
      setSyncing(false);
    },1200);
  },[user]);

  const bootLocal=()=>{
    const d=ld();
    if(d&&Array.isArray(d.lib)&&d.lib.length){
      const clean=sanitize(d.lib);
      const use=clean.length?clean:SEED.map((p,i)=>({...p,ord:i,st:0,ok:0,no:0}));
      setLib(use);setBatch(d.batch||1);setStreak(d.streak||0);setBest(d.best||0);
      return{lib:use,batch:d.batch||1,streak:d.streak||0,best:d.best||0};
    }
    const init=SEED.map((p,i)=>({...p,ord:i,st:0,ok:0,no:0}));
    setLib(init);sv({lib:init,batch:1,streak:0,best:0});
    return{lib:init,batch:1,streak:0,best:0};
  };

  /* startup: check session, then merge cloud with local */
  useEffect(()=>{(async()=>{
    const local=bootLocal();
    if(!sb){setBoot(false);return}
    const{data}=await sb.auth.getSession();
    const u=data?.session?.user||null;
    if(!u){setNeedAuth(true);setBoot(false);return}
    setUser(u);
    const row=await cloudGet(u.id);
    if(row&&row.data&&Array.isArray(row.data.lib)&&row.data.lib.length){
      const c=row.data;const clean=sanitize(c.lib);
      /* cloud wins when it is further along, otherwise keep local and upload it */
      const cloudAhead=(clean.length>local.lib.length)||((c.batch||1)>local.batch);
      if(cloudAhead&&clean.length){
        setLib(clean);setBatch(c.batch||1);setStreak(c.streak||0);setBest(c.best||0);
        sv({lib:clean,batch:c.batch||1,streak:c.streak||0,best:c.best||0});
      }else{
        await cloudPut(u.id,local);
      }
    }else{
      await cloudPut(u.id,local);
    }
    setBoot(false);
  })()},[]);

  const persist=useCallback((l,b,s,bs)=>{
    setLib(l);if(b!==undefined)setBatch(b);if(s!==undefined)setStreak(s);if(bs!==undefined)setBest(bs);
    const payload={lib:l,batch:b??batch,streak:s??streak,best:bs??best};
    sv(payload);cloudPush(payload);
  },[batch,streak,best,cloudPush]);

  const up=useCallback((en,ok)=>{
    setLib(prev=>{
      const next=prev.map(p=>nm(p.en)!==nm(en)?p:{
        ...p,st:Math.min(5,Math.max(0,(p.st||0)+(ok?1:-1))),ok:(p.ok||0)+(ok?1:0),no:(p.no||0)+(ok?0:1)});
      const s=ok?streak+1:0;const bs=Math.max(best,s);
      setStreak(s);setBest(bs);
      const payload={lib:next,batch,streak:s,best:bs};
      sv(payload);cloudPush(payload);
      return next;
    });
  },[streak,best,batch,cloudPush]);

  const signOut=useCallback(async()=>{
    if(sb)await sb.auth.signOut();
    setUser(null);setNeedAuth(true);
  },[]);

  const afterAuth=useCallback(async()=>{
    const{data}=await sb.auth.getSession();
    const u=data?.session?.user;if(!u)return;
    setUser(u);setNeedAuth(false);setBoot(true);
    const row=await cloudGet(u.id);
    const local=ld()||{lib,batch,streak,best};
    if(row&&row.data&&Array.isArray(row.data.lib)&&row.data.lib.length){
      const c=row.data;const clean=sanitize(c.lib);
      if(clean.length){
        setLib(clean);setBatch(c.batch||1);setStreak(c.streak||0);setBest(c.best||0);
        sv({lib:clean,batch:c.batch||1,streak:c.streak||0,best:c.best||0});
      }
    }else{
      await cloudPut(u.id,local);
    }
    setBoot(false);
  },[lib,batch,streak,best]);

  const add=useCallback(items=>{
    const start=lib.length;
    persist([...lib,...items.map((p,i)=>({...p,ord:start+i,st:0,ok:0,no:0}))],batch,streak,best);
    setScr("hub");
  },[lib,batch,streak,best,persist]);

  const unlocked=Math.min(lib.length,BATCH*batch);
  const active=useMemo(()=>lib.slice(0,unlocked),[lib,unlocked]);
  const next3=useMemo(()=>lib.slice(unlocked,unlocked+3),[lib,unlocked]);
  const more=unlocked<lib.length;

  const st=useMemo(()=>{
    const t=active.length;
    const m=active.filter(p=>(p.st||0)>=4).length;
    const l=active.filter(p=>(p.st||0)>0&&(p.st||0)<4).length;
    const avg=t?active.reduce((s,p)=>s+(p.st||0),0)/t:0;
    return{t,m,l,f:t-m-l,pct:Math.round(avg/5*100)};
  },[active]);

  if(boot)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh"}}>
    <div style={{display:"flex",gap:6}}>{[0,1,2].map(i=><div key={i} style={{width:9,height:9,borderRadius:"50%",background:"var(--acc)",animation:`dots 1.2s ${i*.15}s infinite`}}/>)}</div></div>;

  if(needAuth)return<div style={{background:"var(--bg)",minHeight:"100vh"}}>
    <Auth onDone={afterAuth} onSkip={()=>setNeedAuth(false)}/></div>;

  const box={background:"var(--bg)",minHeight:"100vh"};
  if(scr==="import")return<div style={box}><Import ph={lib} onAdd={add} onExit={()=>setScr("hub")}/></div>;
  if(scr==="gate")return<div style={box}><Gate ph={active} onPass={()=>{persist(lib,batch+1,streak,best);setScr("hub")}} onExit={()=>setScr("hub")}/></div>;
  if(scr==="lib")return<div style={box}><Library ph={lib} unlocked={unlocked} onExit={()=>setScr("hub")}
    user={user} onSignIn={()=>setNeedAuth(true)} onSignOut={signOut}
    onWipe={()=>{if(confirm("Wipe all progress and re-lock everything?")){persist(lib.map(p=>({...p,st:0,ok:0,no:0})),1,0,0);setScr("hub")}}}
    onExport={()=>{
      const blob=new Blob([JSON.stringify({v:1,saved:new Date().toISOString(),lib,batch,streak,best},null,1)],{type:"application/json"});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=`lingoforge-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    }}
    onImportBackup={()=>{
      const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
      inp.onchange=e=>{const f=e.target.files[0];if(!f)return;
        const rd=new FileReader();
        rd.onload=ev=>{
          try{
            const d=JSON.parse(ev.target.result);
            const clean=sanitize(d.lib);
            if(!clean.length){alert("This file has no usable phrases.");return}
            if(!confirm(`Load backup?\n\n${clean.length} phrases · batch ${d.batch||1}\n\nThis replaces what is on this device.`))return;
            persist(clean,d.batch||1,d.streak||0,d.best||0);
            setScr("hub");
          }catch(err){alert("Could not read this backup file.")}
        };
        rd.readAsText(f);
      };
      inp.click();
    }}/></div>;

  const P={ph:active,all:lib,up,onExit:()=>setScr("hub")};
  const M={flash:Flash,mcq:MCQ,type:Type,match:Match,build:Build,listen:Listen,speed:Speed};
  if(M[scr]){const C=M[scr];return<div style={box}><C {...P}/></div>}

  const tier=st.pct>=85?"Master":st.pct>=65?"Advanced":st.pct>=45?"Intermediate":st.pct>=20?"Beginner+":"Beginner";

  return(<div style={box}>
    {/* HERO */}
    <div style={{padding:"26px 20px 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:22}}>
        <div>
          <div style={{fontSize:9.5,color:"var(--acc)",textTransform:"uppercase",letterSpacing:".18em",fontWeight:600,marginBottom:5}}>LingoForge</div>
          <div style={{fontSize:27,fontWeight:700,letterSpacing:"-.035em",lineHeight:1.1}}>Batch {batch}</div>
          <div style={{fontSize:12.5,color:"var(--txt3)",marginTop:3}}>{tier} · {st.pct}% mastery</div>
        </div>
        <div style={{display:"flex",gap:7}}>
          <div style={{padding:"9px 13px",borderRadius:13,background:"var(--surface)",border:"1px solid var(--line)",textAlign:"center"}}>
            <div style={{fontSize:16,fontWeight:700,color:streak>0?"var(--acc)":"var(--txt3)"}}>{streak}</div>
            <div style={{fontSize:8.5,color:"var(--txt3)",textTransform:"uppercase",letterSpacing:".07em"}}>streak</div>
          </div>
          <button onClick={()=>setScr("lib")} style={{width:41,padding:"9px 0",borderRadius:13,background:"var(--surface)",border:"1px solid var(--line)",fontSize:16,color:"var(--txt2)",position:"relative"}}>☰
            {user&&<span style={{position:"absolute",top:6,right:7,width:6,height:6,borderRadius:"50%",background:syncing?"var(--warn)":"var(--acc)"}}/>}
          </button>
        </div>
      </div>

      {/* PROGRESS PANEL */}
      <div style={{background:"var(--surface)",border:"1px solid var(--line)",borderRadius:19,padding:"17px 18px",marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:9}}>
          <span style={{fontSize:11,color:"var(--txt3)",textTransform:"uppercase",letterSpacing:".1em"}}>Unlocked</span>
          <span style={{fontSize:14,fontWeight:700}}><span style={{color:"var(--acc)"}}>{unlocked}</span><span style={{color:"var(--txt3)"}}> / {lib.length}</span></span>
        </div>
        <Bar v={unlocked/Math.max(lib.length,1)*100} h={5}/>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:14,paddingTop:14,borderTop:"1px solid var(--line)"}}>
          {[["Active",st.t,"var(--txt)"],["Mastered",st.m,"var(--acc)"],["Learning",st.l,"var(--p2)"],["Fresh",st.f,"var(--txt3)"],["Best 🔥",best,"var(--warn)"]].map(([l,v,c])=>
            <div key={l} style={{textAlign:"center"}}>
              <div style={{fontSize:16,fontWeight:700,color:c}}>{v}</div>
              <div style={{fontSize:8.5,color:"var(--txt3)",textTransform:"uppercase",letterSpacing:".06em",marginTop:1}}>{l}</div>
            </div>)}
        </div>
      </div>

      {/* GATE CTA */}
      {more&&<button onClick={()=>setScr("gate")} style={{width:"100%",padding:"15px 18px",borderRadius:17,background:"linear-gradient(120deg,rgba(255,176,32,.14),rgba(255,138,92,.07))",border:"1px solid rgba(255,176,32,.35)",textAlign:"left",display:"flex",alignItems:"center",gap:13,marginBottom:12}}>
        <span style={{width:38,height:38,borderRadius:12,background:"rgba(255,176,32,.18)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,color:"var(--warn)",flexShrink:0}}>✎</span>
        <span style={{flex:1}}>
          <span style={{display:"block",fontSize:14,fontWeight:600,color:"var(--warn)"}}>Unlock {BATCH} new phrases</span>
          <span style={{display:"block",fontSize:11.5,color:"var(--txt3)",marginTop:2}}>Write a paragraph using your {unlocked} phrases</span>
        </span>
        <span style={{color:"var(--warn)",fontSize:17}}>→</span>
      </button>}
      {!more&&lib.length>BATCH&&<div style={{padding:"13px 16px",borderRadius:15,background:"rgba(0,229,160,.08)",border:"1px solid rgba(0,229,160,.25)",fontSize:13,color:"var(--acc)",textAlign:"center",marginBottom:12,fontWeight:500}}>◆ Every phrase unlocked — full library live</div>}

      {/* NEXT PEEK */}
      {next3.length>0&&<div style={{background:"var(--surface)",border:"1px dashed var(--line)",borderRadius:15,padding:"12px 15px",marginBottom:12}}>
        <div style={{fontSize:9.5,color:"var(--txt3)",textTransform:"uppercase",letterSpacing:".1em",marginBottom:7}}>🔒 Behind the gate</div>
        {next3.map((p,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",gap:10,fontSize:11.5,color:"var(--txt3)",padding:"2px 0"}}>
          <span dir="ltr">{p.en}</span><span className="ar" style={{flexShrink:0,opacity:.6}}>{p.ar}</span></div>)}
      </div>}
    </div>

    {/* DRILLS */}
    <div style={{padding:"0 20px"}}>
      <div style={{fontSize:10.5,color:"var(--txt3)",textTransform:"uppercase",letterSpacing:".14em",fontWeight:600,marginBottom:11}}>Drills</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
        {MODES.map((m,i)=>{
          const wide=i===MODES.length-1&&MODES.length%2===1;
          return<button key={m.id} onClick={()=>{if(active.length<2){alert("Import your phrases first");return}setScr(m.id)}}
            style={{gridColumn:wide?"span 2":"auto",background:"var(--surface)",border:"1px solid var(--line)",borderRadius:17,padding:"15px 14px",textAlign:"left",display:"flex",alignItems:"center",gap:12,transition:"all .2s"}}>
            <span style={{width:38,height:38,borderRadius:12,background:"var(--surface2)",color:m.c,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>{m.ic}</span>
            <span style={{flex:1,minWidth:0}}>
              <span style={{display:"block",fontSize:13.5,fontWeight:600,letterSpacing:"-.01em"}}>{m.t}</span>
              <span style={{display:"block",fontSize:10.5,color:"var(--txt3)",marginTop:1}}>{m.d}</span>
            </span>
          </button>})}
      </div>
    </div>

    {/* IMPORT */}
    <div style={{padding:"16px 20px 34px"}}>
      <button onClick={()=>setScr("import")} style={{width:"100%",padding:14,borderRadius:15,background:"var(--surface)",border:"1px solid var(--line)",fontSize:13.5,fontWeight:500,color:"var(--txt2)",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
        ⬒ Import from Excel <span style={{color:"var(--txt3)",fontSize:12}}>· {lib.length} in library</span>
      </button>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
